workflows:
  ios-maui:
    name: iOS MAUI Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        SOLUTION_FILE: "RecordHidden.slnx"
        PROJECT_NAME: "RecordHidden"
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install .NET SDK
        script: |
          brew install dotnet-sdk

      - name: Install MAUI workloads
        script: |
          dotnet workload install maui maui-ios maui-android

      - name: Restore NuGet packages
        script: |
          dotnet workload restore
          dotnet restore "$SOLUTION_FILE"

      - name: Build MAUI iOS app
        script: |
          dotnet build "$SOLUTION_FILE" \
            -c Debug \
            -f net10.0-ios

    artifacts:
      - "**/bin/Debug/net10.0-ios/**/*.app"
