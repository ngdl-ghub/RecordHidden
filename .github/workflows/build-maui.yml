name: Build MAUI iOS

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x   # cài SDK .NET 8 ổn định

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.4     # runner có iOS SDK 16.x

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Clean project
        run: dotnet clean RecordHidden.csproj

      - name: Restore NuGet packages
        run: dotnet restore RecordHidden.csproj

      # Dump toàn bộ property sau khi MSBuild xử lý
      - name: Dump MSBuild properties
        run: dotnet msbuild RecordHidden.csproj -t:Build -p:TargetFramework=net8.0-ios16.0 -pp:props.txt

      - name: Check props.txt exists
        run: ls -l props.txt || echo "props.txt not found"

      - name: Upload MSBuild props
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-props
          path: props.txt

      - name: Build MAUI iOS app
        run: dotnet build RecordHidden.csproj -c Release -f net8.0-ios16.0 -p:TreatWarningsAsErrors=false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: "**/bin/Release/net8.0-ios16.0/**/*.app"