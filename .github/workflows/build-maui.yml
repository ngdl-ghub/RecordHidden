name: Build MAUI iOS

on:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x   # hiện tại runner hỗ trợ .NET 8

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.0

      - name: Install MAUI workloads
        run: dotnet workload install maui maui-ios

      - name: Restore NuGet packages
        run: dotnet restore RecordHidden.sln

      - name: Build MAUI iOS app
        run: dotnet build RecordHidden.sln -c Release -f net8.0-ios

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-app
          path: "**/bin/Release/net8.0-ios/**/*.app"